# =============================================================================
# Coffee AI Challenge — local stack
# =============================================================================
# Services are added as sprints land:
#   S1 -> coffee-backend, coffee-frontend
#   S3 -> otel-collector, prometheus, loki, grafana, langfuse
#   S4 -> redis
#
# Deviation from the original spec: the spec listed docker-compose.yml in three
# places (root, docker/, langfuse/). One root file plus profiles is simpler and
# avoids drift. langfuse/docker-compose.yml stays as an optional overlay.
#
# Run:  cp .env.example .env  (set LLM_API_KEY)  then  docker compose up -d
#       frontend -> http://localhost:3000    backend -> http://localhost:8000/docs
# =============================================================================

name: coffee-ai

services:
  coffee-backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      # The rules file is mounted below; point the app at the mount, not the
      # repo-root fallback baked into config.py.
      CHALLENGE_CONFIG_PATH: /app/challenge.yaml
      # .env's LANGFUSE_BASE_URL (localhost:3002) is written for a bare host
      # process (`make test`, a host-run uvicorn); inside this container
      # "localhost" is the container itself, not the self-hosted Langfuse
      # stack on the host. Override to the Docker-Desktop host gateway just
      # for the containerized run — see docs/observability.md "Docker
      # networking".
      LANGFUSE_BASE_URL: http://host.docker.internal:3002
    volumes:
      - ./challenge.yaml:/app/challenge.yaml:ro
    extra_hosts:
      # host.docker.internal is built into Docker Desktop (Windows/Mac); this
      # makes the LANGFUSE_BASE_URL override above also resolve on Linux,
      # where it otherwise doesn't exist by default.
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  coffee-frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      # Browser-side calls: the host-mapped backend port, not the compose
      # service name (the fetch runs in the visitor's browser).
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    depends_on:
      - coffee-backend
    restart: unless-stopped
