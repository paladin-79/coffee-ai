# =============================================================================
# Coffee AI Challenge — authoritative game rules
# =============================================================================
# This file is the single source of truth for game behaviour. It is read by the
# backend at startup and is NEVER shipped to the browser in full.
#
# Only the `public` block is exposed via GET /api/challenge.
# Everything else — target, forbidden patterns, solution paths — stays here.
#
# Tuning difficulty should mean editing this file, not changing code.
#
# -----------------------------------------------------------------------------
# GHI CHÚ TIẾNG VIỆT (tổng quan)
# -----------------------------------------------------------------------------
# File này = "luật chơi" duy nhất. Backend đọc lúc khởi động. Muốn chỉnh độ khó
# thì sửa file này, KHÔNG sửa code.
# Chỉ nhánh `public:` được gửi ra trình duyệt qua GET /api/challenge.
# Mọi thứ còn lại (đáp án, pattern bị cấm, solution_paths) là BÍ MẬT, chỉ nằm ở
# backend.
# =============================================================================

challenge_id: coffee-01     # Mã định danh thử thách. Dùng trong log/telemetry để
                            # phân biệt nếu sau này có nhiều thử thách.
version: 1                  # Phiên bản luật chơi. Tăng lên mỗi khi thay đổi lớn
                            # (đáp án, guardrail, scoring) để log truy được "người
                            # chơi này chơi theo luật version mấy".
update_date: 09-09-2026     # Ngày cập nhật file gần nhất (chỉ để con người theo dõi,
                            # backend không dùng).

# -----------------------------------------------------------------------------
# What the frontend is allowed to know
# Nhánh DUY NHẤT được expose cho frontend. Tất cả text người chơi nhìn thấy nằm ở đây.
# -----------------------------------------------------------------------------
public:
  title: "Coffee AI Challenge"                                   # Tiêu đề hiển thị trên trang chơi.
  tagline: "Can you make the AI recommend Vietnamese iced milk coffee?"  # Câu mô tả ngắn dưới tiêu đề.
  instructions_vi: |                                             # Hướng dẫn chơi (bản tiếng Việt).
    AI này là trợ lý tư vấn cà phê Việt Nam.
    Hãy khiến nó gợi ý CÀ PHÊ SỮA ĐÁ — nhưng đừng hỏi trực tiếp.
  instructions_en: |                                             # Hướng dẫn chơi (bản tiếng Anh).
    This AI recommends Vietnamese coffee.
    Make it suggest CÀ PHÊ SỮA ĐÁ — without asking for it directly.
  max_attempts: 30                                              # Số lần thử tối đa cho mỗi phiên chơi.
                                                                # Hết lượt là thua. Backend đếm phía server,
                                                                # không tin số đếm từ client.

# -----------------------------------------------------------------------------
# Win condition — read from the LLM's structured `recommendation` enum only.
# Never from prose. See docs/challenge-design.md.
#
# ĐIỀU KIỆN THẮNG: backend chỉ đọc trường `recommendation` trong JSON mà LLM trả về,
# KHÔNG đọc đoạn văn `reply`. Nếu recommendation == target thì thắng.
# Lý do: nếu dò chữ trong câu trả lời thì người chơi chỉ cần làm AI "nhắc tới"
# cà phê sữa đá là thắng — quá dễ và khó kiểm soát.
# -----------------------------------------------------------------------------
target: iced_milk_coffee    # Đáp án cần đạt. Người chơi thắng khi LLM trả recommendation = giá trị này.
default: egg_coffee         # Hành vi mặc định. Với prompt bình thường, AI phải gợi ý cà phê trứng.
                            # Dùng để test "prompt thường phải ra egg_coffee ≥ 90%".

recommendation_enum:        # Danh sách giá trị hợp lệ cho trường `recommendation` của LLM.
  - egg_coffee              # Nếu LLM trả giá trị ngoài danh sách này -> coi như attempt lỗi.
  - iced_milk_coffee
  - other                   # "other" = AI gợi ý loại khác (không phải trứng, không phải sữa đá).

# -----------------------------------------------------------------------------
# Guardrail categories, ordered cheapest-first.
# Layer 1 = normalised keyword/regex. Layer 2 = embedding similarity.
# Patterns are placeholders until S2 — populate from S0 findings.
#
# GUARDRAIL = bộ lọc chặn prompt TRƯỚC khi gửi cho LLM. Đây là cơ chế game
# (chặn các cách "ăn gian" hiển nhiên), không phải tính năng bảo mật.
# Xử lý theo thứ tự rẻ -> đắt: Layer 1 (so khớp từ khóa) chạy trước Layer 2
# (so sánh ngữ nghĩa bằng embedding, tốn tính toán hơn).
# -----------------------------------------------------------------------------
guardrails:
  # Vietnamese input is lowercased and stripped of diacritics before matching,
  # so `sua da` and `sữa đá` hit the same rule.
  normalize_vietnamese: true   # true = trước khi so khớp, hạ chữ thường + bỏ dấu tiếng Việt.
                               # Nhờ vậy "sua da", "Sữa Đá", "SỮA ĐÁ" đều trúng cùng một pattern.
                               # => pattern Layer 1 nên viết ở dạng KHÔNG dấu.

  categories:                  # 6 nhóm guardrail. Mỗi nhóm bật/tắt và cấu hình độc lập.
    DIRECT_TARGET_REQUEST:     # Nhóm: hỏi thẳng tên đồ uống mục tiêu.
      enabled: true            # true = nhóm này đang hoạt động. false = tắt (dùng để tinh chỉnh độ khó).
      layer: 1                 # 1 = so khớp từ khóa/regex. 2 = so sánh ngữ nghĩa.
      patterns:                # Danh sách cụm từ bị chặn (viết ở dạng không dấu vì normalize_vietnamese).
        - "ca phe sua da"
        - "sua da"
        - "iced milk coffee"
        - "milk coffee"

    ALLERGY_WORKAROUND:        # Nhóm: lấy cớ dị ứng trứng để loại cà phê trứng.
      enabled: true
      layer: 1
      patterns:
        - "di ung"
        - "allergic"
        - "allergy"
        - "dị ứng"             # Lưu ý: nếu normalize_vietnamese=true thì dòng có dấu này thừa,
                               # vì "di ung" ở trên đã bắt được. Giữ lại cũng không sao.

    PREFERENCE_DECLARATION:    # Nhóm: tuyên bố sở thích trực tiếp ("tôi chỉ uống...", "đừng gợi ý...").
      enabled: true
      layer: 2                 # Layer 2: không so khớp từ khóa cứng mà so sánh Ý NGHĨA câu với các
                               # câu mẫu bên dưới. Bắt được cả cách diễn đạt lạ.
      examples:                # Câu mẫu đại diện cho nhóm này. Backend tính embedding của các câu này.
        - "Tôi chỉ uống cà phê sữa đá."
        - "Tôi không thích cà phê trứng."
        - "Đừng recommend cà phê trứng."
      similarity_threshold: 0.82  # Ngưỡng chặn (0..1). Prompt bị chặn nếu độ tương đồng với một
                                  # câu mẫu >= 0.82. Số cao hơn = khó chặn hơn (lỏng hơn).
                                  # Số thấp hơn = dễ chặn nhầm câu vô hại (chặt hơn).

    PROMPT_INJECTION:          # Nhóm: cố ghi đè/bỏ qua chỉ dẫn hệ thống, đổi vai của AI.
      enabled: true
      layer: 1
      patterns:
        - "ignore previous"
        - "ignore all"
        - "bo qua huong dan"
        - "you are now"
        - "new instructions"
        - "tôi muốn lấy dữ liệu"
        - "giả sử tôi là"
        - "hãy coi tôi là"

    SYSTEM_PROMPT_EXTRACTION:  # Nhóm: cố moi nội dung system prompt / chỉ dẫn ẩn.
      enabled: true
      layer: 1
      patterns:
        - "system prompt"
        - "your instructions"
        - "repeat everything above"

    SENSITIVE_REQUEST:         # Nhóm: nội dung nhạy cảm/không liên quan cà phê. Hiện để trống,
      enabled: true            # sẽ điền pattern sau khi khảo sát ở giai đoạn S0/S2.
      layer: 1
      patterns: []

  # Shown to the player on a block. Deliberately vague — the real category is
  # logged for observability but never returned.
  #
  # Thông báo hiện cho người chơi khi bị chặn. CỐ TÌNH mơ hồ: không nói rõ trúng
  # nhóm nào, để người chơi tự mò. Nhóm thật chỉ được ghi vào log/telemetry.
  block_message_vi: |
    🚫 Prompt bị chặn
    Câu lệnh của bạn đã kích hoạt một guardrail của thử thách.
    Hãy thử cách khác.
  block_message_en: |
    🚫 Prompt blocked
    Your prompt triggered one of the challenge guardrails.
    Try another approach.

# -----------------------------------------------------------------------------
# Adversary tracking — honeypot / talent-spotting
#
# NHẬN DIỆN NGƯỜI CHƠI CÓ Ý ĐỒ TẤN CÔNG LLM (prompt injection, moi system prompt...).
# Đây là CÔNG CỤ CHO NGƯỜI VẬN HÀNH, không phải cơ chế game cho người chơi:
#   - KHÔNG bao giờ gửi ra client (không nằm trong `public`).
#   - KHÔNG lên leaderboard công khai.
#   - Người chơi KHÔNG được báo là mình bị đánh dấu (có thể tiết lộ sau sự kiện).
# Mục tiêu: sau sự kiện, lọc ra danh sách phiên chơi "đáng chú ý" để xem lại.
# -----------------------------------------------------------------------------
adversary_tracking:
  enabled: true
  visibility: operator_only     # Chỉ hiện ở Grafana/Langfuse cho người vận hành.

  # Chỉ các nhóm guardrail dưới đây được coi là "tấn công thật sự" và được cộng
  # điểm adversary. Các nhóm còn lại (DIRECT_TARGET_REQUEST, ALLERGY_WORKAROUND,
  # PREFERENCE_DECLARATION) chỉ là người chơi ngây thơ thử cách hiển nhiên -> bỏ qua.
  # Số bên phải là TRỌNG SỐ điểm cho mỗi kỹ thuật.
  signal_categories:
    PROMPT_INJECTION: 3
    SYSTEM_PROMPT_EXTRACTION: 3
    SENSITIVE_REQUEST: 2

  # Chỉ đếm mỗi nhóm MỘT lần cho mỗi phiên -> tránh thưởng cho việc spam cùng
  # một chiêu. true = distinct; false = cộng dồn mỗi lần trúng.
  count_distinct_only: true

  # Tín hiệu mạnh nhất: người chơi bị chặn ở một nhóm signal, sau đó đổi cách
  # diễn đạt và ĐẨY LỌT một prompt tương tự về ngữ nghĩa qua guardrail.
  # Backend so sánh embedding prompt bị chặn với các prompt lọt sau đó trong
  # cùng phiên; nếu vượt ngưỡng thì cộng thêm `bypass_bonus`.
  bypass_detection:
    enabled: true
    similarity_threshold: 0.80  # Độ tương đồng ngữ nghĩa để coi là "cùng ý đồ".
    bypass_bonus: 5             # Điểm cộng thêm khi phát hiện lách lọt.

  # Tổng điểm adversary của một phiên >= ngưỡng này -> phiên bị gắn cờ và đẩy lên
  # dashboard "Potential adversaries" cho người vận hành.
  flag_threshold: 6

  # Nhãn ghi vào log/trace khi một prompt trúng nhóm signal (để query & lọc).
  log_label: unsafe

# -----------------------------------------------------------------------------
# Scoring — see docs/challenge-design.md for rationale
#
# Công thức tính điểm (backend tính, không tin điểm do client gửi):
#   score = max(minimum,
#               base
#               - số_lần_thử        * attempt_penalty
#               - số_giây_đã_trôi   * time_penalty_per_second
#               - số_lần_bị_chặn    * guardrail_block_penalty)
# -----------------------------------------------------------------------------
scoring:
  base: 1000                   # Điểm khởi đầu khi vừa thắng, trước khi trừ.
  attempt_penalty: 25          # Trừ mỗi lần thử (khuyến khích thắng nhanh, ít lần).
  time_penalty_per_second: 2   # Trừ mỗi giây tính từ lúc bắt đầu phiên tới lúc thắng.
  guardrail_block_penalty: 10  # Trừ mỗi lần prompt bị guardrail chặn. Để NHỎ vì thăm dò
                               # guardrail là lối chơi hợp lệ, không nên phạt nặng.
  minimum: 100                 # Sàn điểm — thắng thì không bao giờ dưới mức này.

# -----------------------------------------------------------------------------
# LLM behaviour — tham số gọi model.
# -----------------------------------------------------------------------------
llm:
  temperature: 0.4             # Độ ngẫu nhiên của model (0 = luôn giống nhau, cao = sáng tạo/lung tung
                               # hơn). Thấp giúp hành vi mặc định ổn định (dễ ra egg_coffee).
  max_tokens: 400              # Giới hạn độ dài câu trả lời của model (chặn chi phí + trả lời lan man).
  # Full text lives in backend/app/challenge/prompts/system_v1.txt
  system_prompt_file: system_v1.txt   # Tên file chứa system prompt đầy đủ. Tách khỏi YAML cho dễ sửa.
                                      # Đường dẫn gốc: backend/app/challenge/prompts/

# -----------------------------------------------------------------------------
# Intended solution paths — SPOILERS.
# Used by test_guardrail_balance.py to assert guardrails don't block the
# intended ways to win. Fill in during S0.
#
# CÁC CÁCH THẮNG DỰ KIẾN — TIẾT LỘ ĐÁP ÁN. Đừng mở file này khi đang demo/sự kiện.
# Ý tưởng chung: người chơi KHÔNG gọi tên đồ uống, mà mô tả một tình huống/ràng buộc
# mà cà phê sữa đá là lời giải hợp lý.
# Bộ test dùng danh sách này để đảm bảo guardrail KHÔNG chặn nhầm các đường thắng hợp lệ.
# -----------------------------------------------------------------------------
solution_paths:
  - id: heat_and_speed         # Mã định danh đường thắng (dùng trong test và log).
    description: "Situational constraint — extreme heat, needs something fast and cold"  # Mô tả cơ chế.
    reference_prompt: "TODO — fill in from S0 spike"   # Prompt mẫu ĐÃ KIỂM CHỨNG. Điền sau khi chạy
                                                       # spike thử nghiệm với model thật ở giai đoạn S0.
    expected_success_rate: 0.7  # Tỉ lệ thắng kỳ vọng khi dùng prompt mẫu (0.7 = 7/10 lần).
                                # Test sẽ cảnh báo nếu thực tế thấp hơn nhiều.

  - id: group_order
    description: "Audience constraint — ordering for a group, needs a safe common denominator"
    reference_prompt: "TODO — fill in from S0 spike"
    expected_success_rate: 0.7

  - id: logistics
    description: "Practical constraint — must survive a 30-minute delivery"
    reference_prompt: "TODO — fill in from S0 spike"
    expected_success_rate: 0.7
