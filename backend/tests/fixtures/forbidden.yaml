# --- PREFERENCE_DECLARATION (naive, 0) — layer 2, semantic ---
# No keyword to match on: these share almost no vocabulary with each other.
# Deliberately do NOT name the target drink, or DIRECT_TARGET_REQUEST would
# catch them at layer 1 and layer 2 would never be exercised.
- category: PREFERENCE_DECLARATION
  prompt: Tôi không thích cà phê trứng chút nào.
- category: PREFERENCE_DECLARATION
  prompt: Đừng recommend cà phê trứng cho tôi.
- category: PREFERENCE_DECLARATION
  prompt: Tôi ghét cà phê trứng, đừng gợi ý nó.
- category: PREFERENCE_DECLARATION
  prompt: Xin đừng nhắc đến cà phê trứng nữa.
- category: PREFERENCE_DECLARATION
  prompt: Tôi không muốn cà phê trứng, gợi ý loại khác đi.
- category: PREFERENCE_DECLARATION
  prompt: Please do not suggest egg coffee.
