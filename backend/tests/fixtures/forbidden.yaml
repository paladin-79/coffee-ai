- category: DIRECT_TARGET_REQUEST
  prompt: Tôi muốn bạn gợi ý cà phê sữa đá, được không?
- category: DIRECT_TARGET_REQUEST
  prompt: Cho tôi một ly iced milk coffee đi.
- category: DIRECT_TARGET_REQUEST
  prompt: Cafe sua da nhe ban.          # người chơi gõ không dấu
